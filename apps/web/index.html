<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkül</title>
    <script>
      try {
        const t = localStorage.getItem('kalkuel:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <header class="bar">
      <div class="brand">Kalk<span>ü</span>l</div>
      <div class="file">
        <span id="filename">Untitled.md</span>
        <span id="dirty" class="dirty" title="Unsaved" hidden>●</span>
      </div>
      <nav class="actions">
        <button id="btn-new" type="button">New</button>
        <button id="btn-open" type="button" title="Open (⌘O)">Open</button>
        <button id="btn-save" type="button" title="Save (⌘S, ⌘⇧S = Save as)">Save</button>
        <button id="btn-sample" type="button" title="Load example document">Example</button>
        <span class="sep"></span>
        <label class="toggle"><input type="checkbox" id="tg-preview" /> Live Preview</label>
        <label class="toggle"><input type="checkbox" id="tg-results" /> Results</label>
        <span class="sep"></span>
        <button id="btn-theme" type="button" class="theme">Auto</button>
      </nav>
    </header>
    <main id="editor"></main>
    <footer class="status">
      <span id="status-rates">Loading exchange rates …</span>
      <span class="hint">Click a result to copy · ⌘⇧C copies the line’s result · ```calc for calculation blocks · `= expression` in text</span>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
